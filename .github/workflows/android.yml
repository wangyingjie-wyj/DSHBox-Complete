name: Build complete Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore and verify all bundled materials
        shell: powershell
        run: .\Build.ps1 -VerifyOnly -NoPause
      - name: Run unit tests
        shell: powershell
        run: .\gradlew.bat testDebugUnitTest --console=plain
      - name: Build and verify complete release APK
        shell: powershell
        run: .\Build.ps1 -NoPause
      - uses: actions/upload-artifact@v4
        with:
          name: DSHBox-v1.3.1-complete-apk
          path: dist/DSHBox-v1.3.1-local.apk
          if-no-files-found: error
